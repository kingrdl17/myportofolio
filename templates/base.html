{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-[url('/static/img/background.png')] bg-cover bg-center bg-fixed bg-no-repeat font-sans leading-[1.6] text-[#f5f5f7]">
    {% include "components/navbar.html" %}
    {% block content %} {% endblock content %}
    {% include "components/footer.html" %}
    {% include 'components/toast.html' %}
</body>
</html>
