<div id="add-education-modal"
     class="education-form-modal education-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-education-modal-title">
    <button type="button"
            class="education-form-modal__backdrop education-delete-modal__backdrop"
            popovertarget="add-education-modal"
            popovertargetaction="hide"
            aria-label="Close add education form"></button>

    <div class="education-form-modal__content education-delete-modal__content">
        <button type="button"
                class="education-form-modal__close education-delete-modal__close button"
                popovertarget="add-education-modal"
                popovertargetaction="hide"
                aria-label="Close add education form">×</button>

        <h2 id="add-education-modal-title">Add New Education</h2>
        <form id="education-form"
              method="post"
              action="{% url 'main:create_education_ajax' %}"
              class="education-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="education-form-modal__actions education-delete-modal__actions">
                <button type="button"
                        class="button-neutral"
                        popovertarget="add-education-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button-action">Add Education</button>
            </div>
        </form>
    </div>
</div>
