<div id="delete-edu-{{ education.id }}"
     class="education-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-edu-title-{{ education.id }}">
    <button type="button"
            class="education-delete-modal__backdrop"
            popovertarget="delete-edu-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="education-delete-modal__content">
        <button type="button"
                class="education-delete-modal__close"
                popovertarget="delete-edu-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-edu-title-{{ education.id }}">Delete education?</h2>
        <p>
            Are you sure you want to permanently delete this?
        </p>
        <div class="education-delete-modal__actions">
            <button type="button"
                    class="button-neutral"
                    popovertarget="delete-edu-{{ education.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button-danger">DELETE</button>
            </form>
        </div>
    </div>
</div>
