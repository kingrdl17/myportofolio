{% extends "base.html" %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1>{% if education %}Edit Education{% else %}Add New Education{% endif %}</h1>
                <form method="post"
                      action="{% if education %}{% url 'main:edit_education' education.id %}{% else %}{% url 'main:create_education' %}{% endif %}"
                      class="education-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button-action">{% if education %}Save Changes{% else %}Add education{% endif %}</button>
                    <a href="{% url 'main:show_education' %}" class="button-neutral">Cancel</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
