  {% extends 'base.html' %}
  {% block content %}
    <main>
        <!-- PROFILE SECTION -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">
                        <span class="kicker-comp">Computer</span>
                        <span class="kicker-science">Science</span>
                        <span class="kicker-dot">&middot;</span>
                        <span class="kicker-ui">Universitas Indonesia</span>
                    </p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/clay.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/kingrdl17" class="button-neutral">GitHub</a>
                        <a href="https://linkedin.com/in/marclayardell" class="button-neutral">LinkedIn</a>
                        <a href="mailto:ardellmarclay@gmail.com" class="button-neutral">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {% endblock content %}
